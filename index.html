<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <!-- 限制网页缩放，让它在手机上摸起来完全像一个真正的 App -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SECOV WorkHub</title>
    
    <!-- SECOV 专属桌面图标 -->
    <link rel="apple-touch-icon" sizes="180x180" href="https://i.postimg.cc/fymvJJHN/SECOVworkhub-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="https://i.postimg.cc/fymvJJHN/SECOVworkhub-icon.png">
    <link rel="shortcut icon" href="https://i.postimg.cc/fymvJJHN/SECOVworkhub-icon.png">
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #ffffff; }
        iframe { border: none; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <!-- 这里放你原本的 GAS 长链接，allow="geolocation" 就是开启 GPS 的神仙钥匙 -->
    <iframe src="https://script.google.com/macros/s/AKfycbwZcRpjRaMnpQ69B68YkE94BOFYmkivnkfWI1z7hslNzO9o1gUgP4sTcXFxqiRJgi_q3w/exec" allow="geolocation; camera; microphone"></iframe>
</body>
</html>
